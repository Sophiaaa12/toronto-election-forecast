project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - "!tables/*.md"

website:
  title: "Toronto 2026 Municipal Election Forecast"
  site-url: https://sophiaaa12.github.io/toronto-election-forecast/
  page-footer:
    left: "Jingwen Zhong and Siyi Zhu · STA2453, University of Toronto · [GitHub repository](https://github.com/Sophiaaa12/toronto-election-forecast)"
    right: "Every number on this site comes from synthetic LLM responses, not real voters."
  navbar:
    pinned: false
    left:
      - text: "Overview"
        href: index.qmd#overview
      - text: "Election Forecasts"
        href: index.qmd#forecasts
      - text: "Daily Tracker"
        href: index.qmd#daily
      - text: "Provider Comparison"
        href: index.qmd#providers
      - text: "Forecast Uncertainty"
        href: index.qmd#uncertainty
      - text: "Diagnostics"
        href: index.qmd#diagnostics
      - text: "Data & Methods"
        href: index.qmd#methods
      - text: "Discussion"
        href: index.qmd#discussion
      - text: "Limitations"
        href: index.qmd#limitations
      - text: "Reproducibility"
        href: index.qmd#reproducibility
      - text: "References"
        href: index.qmd#refs

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    anchor-sections: true
    code-tools: false
    css:
      - styles.css
    fig-cap-location: bottom
    tbl-cap-location: top
