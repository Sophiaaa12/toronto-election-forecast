name: Daily forecast

# Every morning: fetch Toronto news, poll the LLM persona panel,
# post-stratify, commit the new data, and republish the website.
# Pushes that touch the website only re-render and republish it.

on:
  # GitHub can delay or drop scheduled runs, so later slots are backups:
  # once a day has been polled, run_daily.sh skips the API calls.
  schedule:
    - cron: "17 10 * * *"   # 06:17 Toronto (EDT)
    - cron: "17 13 * * *"   # 09:17 backup
    - cron: "17 16 * * *"   # 12:17 backup
    - cron: "0 18 * * *"    # 14:00 backup
    - cron: "17 20 * * *"   # 16:17 backup
  workflow_dispatch:
    inputs:
      force_poll:
        description: "Re-poll today even if today's responses already exist (spends API credits)"
        type: boolean
        default: false
      skip_poll:
        description: "Only rebuild and republish the website"
        type: boolean
        default: false
      budget_usd:
        description: "Override today's spend cap in USD (blank = repo variable DAILY_BUDGET_USD or 1.50)"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/daily-forecast.yml"

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  daily:
    # Pin the image that succeeded on 21 Oct. ubuntu-latest is moving to
    # Ubuntu 26.04 through 19 Nov 2026, and setup-r has hung on that label.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      POLL: ${{ github.event_name != 'push' && inputs.skip_poll != true }}
      WORK_DIR: ${{ github.workspace }}/.daily-work
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued backup run must see the data committed by the run before it.
          ref: main

      - name: Poll date (Toronto)
        id: date
        run: echo "date=$(TZ=America/Toronto date +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: env.POLL == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm/requirements.txt

      - name: Install Python dependencies
        if: env.POLL == 'true'
        run: pip install -r llm/requirements.txt

      - uses: r-lib/actions/setup-r@v2
        if: env.POLL == 'true'
        timeout-minutes: 20
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: env.POLL == 'true'
        timeout-minutes: 20
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::readr
            any::jsonlite
            any::nanoparquet
            any::ggplot2
            any::scales
            any::readxl

      - name: Restore today's LLM response cache
        if: env.POLL == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/cache
            ${{ env.WORK_DIR }}/news-*.json
          key: daily-llm-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: daily-llm-${{ steps.date.outputs.date }}-

      - name: Poll the persona panel
        if: env.POLL == 'true'
        timeout-minutes: 100
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POLL_DATE: ${{ steps.date.outputs.date }}
          POLL_END_DATE: ${{ vars.POLL_END_DATE || '2026-10-26' }}
          DAILY_BUDGET_USD: ${{ inputs.budget_usd || vars.DAILY_BUDGET_USD || '1.50' }}
          DAILY_PERSONAS_PER_CELL: ${{ vars.DAILY_PERSONAS_PER_CELL || '4' }}
          FORCE_POLL: ${{ inputs.force_poll == true }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the OPENROUTER_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p "$WORK_DIR"
          scripts/run_daily.sh

      - name: Save LLM response cache
        if: always() && env.POLL == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.WORK_DIR }}/cache
            ${{ env.WORK_DIR }}/news-*.json
          key: daily-llm-${{ steps.date.outputs.date }}-${{ github.run_id }}

      - name: Build daily figures and tables
        if: env.POLL == 'true'
        run: Rscript website/make_daily.R

      - name: Commit new daily data
        if: env.POLL == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed/daily website/figures website/tables
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily tracker: ${{ steps.date.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to GitHub Pages (gh-pages branch)
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
